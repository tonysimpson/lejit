name: CI

# diagnostic only: times test_signal's stress tests, plain and with LeJIT

on:
  pull_request:
  workflow_dispatch:

jobs:
  signal-timing:
    name: signal timing (${{ matrix.python }}, ${{ matrix.rep }})
    runs-on: ubuntu-24.04
    container: python:${{ matrix.python }}-bookworm
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8.20", "3.10.16"]
        rep: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - name: Install libffi and libunwind
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libffi-dev libunwind-dev util-linux
      - uses: actions/cache@v4
        with:
          path: .cache
          key: cpython-source-${{ hashFiles('tools/features/cpython_sha256.txt') }}
      - name: Restore CPython's tests
        run: |
          src=$(python -c "import sys, platform; sys.path.insert(0, 'tools/features'); import cpython_src; print(cpython_src.find_source(platform.python_version(), log=lambda *a: None))")
          stdlib=$(python -c "import sysconfig; print(sysconfig.get_paths()['stdlib'])")
          (cd "$src/Lib" && find . -type d \( -name test -o -name tests \) -prune -exec cp -r --parents {} "$stdlib" \;)
          python -Wi -m compileall -q -x 'bad_coding|badsyntax|site-packages|lib2to3/tests/data' "$stdlib"
      - name: Machine
        run: |
          nproc; lscpu | head -20; uname -a
          echo "timerslack_ns $(cat /proc/self/timerslack_ns)"
          echo "clocksource $(cat /sys/devices/system/clocksource/clocksource0/current_clocksource)"
          cat /sys/fs/cgroup/cpu.max 2>/dev/null || true
          grep -E '^(steal|procs_running)|^cpu ' /proc/stat || true
      - name: Checked build
        run: make checked-build PY=python
      - name: Stress tests alone
        if: always()
        run: |
          python tests/cpython/signal_timing.py plain 3 2>&1 | grep -v '^detected'
          python tests/cpython/signal_timing.py lejit 3 2>&1 | grep -v '^detected'
      - name: Every CPython test module, as make check runs them
        if: always()
        run: |
          LE_SIGNAL_TIMING=$PWD/timing.txt python tests/cpython/run.py | grep -v '^ok ' || true
          echo '--- test_signal stress timings'
          cat timing.txt || true
          grep -E '^cpu |^steal' /proc/stat || true
      - name: Stress tests beside six jobs of CPython tests
        if: always()
        run: |
          (for i in 1 2 3; do python tests/cpython/run.py -j 6 test_set test_shelve test_shlex test_shutil test_site test_slice test_smtpd test_smtplib test_socketserver test_sort test_sqlite test_statistics test_string test_struct test_subprocess >/dev/null 2>&1; done) &
          bg=$!
          sleep 20
          for i in 1 2 3; do
            python tests/cpython/signal_timing.py plain 1 2>&1 | grep -v '^detected'
            python tests/cpython/signal_timing.py lejit 1 2>&1 | grep -v '^detected'
          done
          kill $bg || true
