name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: make check (${{ matrix.python }})
    runs-on: ubuntu-24.04
    # the official images give exact CPython releases, built as shared
    # libraries with their headers
    container: python:${{ matrix.python }}-bookworm
    strategy:
      fail-fast: false
      matrix:
        python: ["3.7.17", "3.8.20", "3.9.21", "3.10.16"]
    steps:
      - uses: actions/checkout@v4
      - name: Install libffi and libunwind
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libffi-dev libunwind-dev
      # the source detector's releases, fetched from python.org once
      - uses: actions/cache@v4
        with:
          path: .cache
          key: cpython-source-${{ hashFiles('tools/features/cpython_sha256.txt') }}
      # the images leave out CPython's own tests: copy them back from the
      # release's source
      - name: Restore CPython's tests
        run: |
          src=$(python -c "import sys, platform; sys.path.insert(0, 'tools/features'); import cpython_src; print(cpython_src.find_source(platform.python_version(), log=lambda *a: None))")
          stdlib=$(python -c "import sysconfig; print(sysconfig.get_paths()['stdlib'])")
          cd "$src/Lib"
          find . -type d \( -name test -o -name tests \) -prune -exec cp -r --parents {} "$stdlib" \;
      - name: make check
        run: make -k check PY=python GEN_PY=python

  format:
    name: make format-check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # the runner's own Python refuses pip installs (PEP 668)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # the version the tree is formatted with: others lay it out differently
      - name: Install clang-format
        run: pip install clang-format==19.1.7
      - name: make format-check
        run: make format-check

  wheels:
    name: wheels (built, not released)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # cibuildwheel 3 dropped Python 3.7
      - uses: pypa/cibuildwheel@v2.23.3
        env:
          CIBW_BUILD: "cp37-* cp38-* cp39-* cp310-*"
          CIBW_SKIP: "*-musllinux_*"
          CIBW_ARCHS_LINUX: x86_64
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_BEFORE_ALL_LINUX: >-
            dnf install -y epel-release &&
            dnf install -y libffi-devel libunwind-devel
          CIBW_TEST_COMMAND: >-
            python -c "import lejit; lejit.start(check=True, error=True); print(sorted(lejit.check()))"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: wheelhouse/*.whl
