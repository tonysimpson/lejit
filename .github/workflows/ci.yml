name: CI

on:
  push:
    branches: [main]
  # a draft runs nothing: its jobs are all skipped until it is marked ready
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # by hand, on any branch: the jobs and versions chosen
  workflow_dispatch:
    inputs:
      jobs:
        description: >-
          Jobs, separated by spaces or commas: check (make check, with
          tests/cpython), encoder, release, build, install, detectors, wheels,
          format, lint, or all. Empty runs format and lint, as a pull request
          does
        type: string
        default: ""
      versions:
        description: >-
          Versions for the jobs that run on several, e.g. "3.7 3.15". Empty
          runs each job's usual set
        type: string
        default: ""

# each pull request has a group, and pushes to main share one: a newer run
# cancels the older, running or waiting, so only the latest survives. A run
# started by hand has a group of its own, since a group's waiting run is
# cancelled when another joins, whatever cancel-in-progress says
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  # what this run tests: main gets every job on every version; a pull
  # request gets format, and lint unless it changes only docs and tests; a
  # run by hand gets the jobs and versions chosen. `jobs` lists the jobs to
  # run, and each job that runs on several versions has its versions here,
  # empty when it doesn't run
  changes:
    name: changes
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    outputs:
      jobs: ${{ steps.what.outputs.jobs }}
      check: ${{ steps.what.outputs.check }}
      release: ${{ steps.what.outputs.release }}
      build: ${{ steps.what.outputs.build }}
      install-newer: ${{ steps.what.outputs.install-newer }}
      install-uv: ${{ steps.what.outputs.install-uv }}
      detectors-newer: ${{ steps.what.outputs.detectors-newer }}
    steps:
      # a pull request's checkout is its merge into the base: the first
      # parent is the base
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: what
        env:
          EVENT: ${{ github.event_name }}
          JOBS: ${{ inputs.jobs }}
          VERSIONS: ${{ inputs.versions }}
        run: |
          changed=$(git diff --name-only HEAD^1 HEAD)
          if [ "$EVENT" != pull_request ] ||
             grep -qvE '^(docs/|tests/|[^/]*\.md$)' <<< "$changed"; then
            export LINT=true
          fi
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os, re, sys

          every = ["check", "encoder", "release", "build", "install",
                   "detectors", "wheels", "format", "lint"]
          # each job that runs on several versions: the name chosen by, and
          # its versions
          matrices = {
              "check": ("check", ["3.7.17", "3.8.20", "3.9.21", "3.10.16",
                                  "3.11.11", "3.12.9", "3.13.2", "3.14.10"]),
              "release": ("release", ["3.10.16", "3.11.11", "3.12.9"]),
              "build": ("build", ["3.7.17", "3.8.20", "3.9.21", "3.10.16",
                                  "3.11.11", "3.12.9", "3.13.2", "3.14.10",
                                  "3.15.2"]),
              "install-newer": ("install", ["3.11.11", "3.12.9", "3.13.2",
                                            "3.14.10", "3.15.2"]),
              "install-uv": ("install", ["3.8", "3.9", "3.10", "3.11", "3.12",
                                         "3.13", "3.14", "3.15"]),
              "detectors-newer": ("detectors", ["3.15.2"]),
          }

          event = os.environ["EVENT"]
          asked = re.split(r"[\s,]+", os.environ["JOBS"].strip())
          if event == "push" or asked == ["all"]:
              jobs = every
          elif event == "pull_request" or asked == [""]:
              jobs = ["format", "lint"]
          else:
              unknown = set(asked) - set(every)
              if unknown:
                  sys.exit("::error::no such job: " + " ".join(sorted(unknown)))
              jobs = [job for job in every if job in asked]
          if not os.environ.get("LINT"):
              jobs = [job for job in jobs if job != "lint"]
          print("jobs=" + json.dumps(jobs))

          # "3.7" chooses 3.7.17, and "3.1" chooses nothing
          chosen = re.split(r"[\s,]+", os.environ["VERSIONS"].strip())
          if event != "workflow_dispatch" or chosen == [""]:
              chosen = None
          def picked(version):
              parts = version.split(".")
              return chosen is None or any(
                  parts[:len(c.split("."))] == c.split(".") for c in chosen)
          used = False
          for job, (name, versions) in matrices.items():
              run = [v for v in versions if name in jobs and picked(v)]
              used = used or bool(run)
              print(job + "=" + json.dumps(run))
          if chosen and not used:
              sys.exit("::error::no job chosen runs on those versions")
          EOF

  check:
    name: make check (${{ matrix.python }})
    needs: changes
    if: needs.changes.outputs.check != '[]'
    runs-on: ubuntu-24.04
    # the official images give exact CPython releases, built as shared
    # libraries with their headers
    container: python:${{ matrix.python }}-bookworm
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(needs.changes.outputs.check) }}
    steps:
      - uses: actions/checkout@v4
      - name: Install libffi, libunwind, setuptools and cffi
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libffi-dev libunwind-dev
          # the 3.12 images and later have no setuptools
          python -c 'import setuptools' 2>/dev/null || pip install setuptools
          # for tests/jit's cffi cases, which are skipped without it
          pip install cffi
      # the source detector's releases, fetched from python.org once
      - uses: actions/cache@v4
        with:
          path: .cache
          key: cpython-source-${{ hashFiles('tools/features/cpython_sha256.txt') }}
      # the images leave out CPython's own tests and every .pyc: copy the
      # tests back from the release's source, then byte-compile the library
      # as CPython's install does (otherwise the first run of a test compiles
      # what it imports, and sees warnings a second run doesn't)
      - name: Restore CPython's tests
        run: |
          src=$(python -c "import sys, platform; sys.path.insert(0, 'tools/features'); import cpython_src; print(cpython_src.find_source(platform.python_version(), log=lambda *a: None))")
          stdlib=$(python -c "import sysconfig; print(sysconfig.get_paths()['stdlib'])")
          (cd "$src/Lib" && find . -type d \( -name test -o -name tests \) -prune -exec cp -r --parents {} "$stdlib" \;)
          python -Wi -m compileall -q -x 'bad_coding|badsyntax|site-packages|lib2to3/tests/data|test_lib2to3/data' "$stdlib"
      # make check but the encoder test, which doesn't depend on the version
      # and runs once, in its own job
      - name: make check
        run: >-
          make -k no-version-tests features-installed-test strings-test
          test cpython-test PY=python GEN_PY=python

  encoder:
    name: make encoder-test
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'encoder')
    runs-on: ubuntu-24.04
    container: python:3.10.16-bookworm
    steps:
      - uses: actions/checkout@v4
      - name: Install libffi and libunwind
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libffi-dev libunwind-dev
      - name: make encoder-test
        run: make encoder-test PY=python GEN_PY=python

  # the build users get (-O3), which make check never runs: its results must
  # match plain CPython's too
  release:
    name: release build (${{ matrix.python }})
    needs: changes
    if: needs.changes.outputs.release != '[]'
    runs-on: ubuntu-24.04
    container: python:${{ matrix.python }}-bookworm
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(needs.changes.outputs.release) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install libffi, libunwind and setuptools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libffi-dev libunwind-dev
          # the 3.12 images and later have no setuptools
          python -c 'import setuptools' 2>/dev/null || pip install setuptools
      - name: Build
        run: make build PY=python
      - name: Build info
        run: python tests/jit/build_info.py
      - name: Smoke test
        run: diff <(python tests/jit/smoke.py plain 2>&1) <(python tests/jit/smoke.py lejit 2>&1)
      - name: tests/jit
        run: python tests/jit/run.py --release

  # every supported version: the checked and release builds must compile
  # and load
  build:
    name: build (${{ matrix.python }})
    needs: changes
    if: needs.changes.outputs.build != '[]'
    runs-on: ubuntu-24.04
    container: python:${{ matrix.python }}-bookworm
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(needs.changes.outputs.build) }}
    steps:
      - uses: actions/checkout@v4
      - name: Install libffi, libunwind and setuptools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libffi-dev libunwind-dev
          python -c 'import setuptools' 2>/dev/null || pip install setuptools
      - name: Checked build
        run: make checked-build PY=python && python tests/jit/build_info.py
      - name: Release build
        run: make build PY=python && python tests/jit/build_info.py

  # a plain install where no wheel is built: it builds the extension, and
  # start() starts with no warning
  install-newer:
    name: install (${{ matrix.python }})
    needs: changes
    if: needs.changes.outputs.install-newer != '[]'
    runs-on: ubuntu-24.04
    container: python:${{ matrix.python }}-bookworm
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(needs.changes.outputs.install-newer) }}
    steps:
      - uses: actions/checkout@v4
      - name: Install libffi and libunwind
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libffi-dev libunwind-dev
      - name: Install
        run: |
          pip install .
          cd /
          python -c "
          import warnings, lejit
          with warnings.catch_warnings(record=True) as w:
              warnings.simplefilter('always')
              lejit.start()
          assert lejit._core is not None, 'no extension was built'
          assert not w, [str(x.message) for x in w]
          "

  # uv's own interpreters (python-build-standalone: clang, link-time
  # optimisation, BOLT, and the tail-call interpreter from 3.14): lejit
  # installs, and check() finds no difference, also where a .pth starts
  # LeJIT for every program
  install-uv:
    name: install (uv ${{ matrix.python }})
    needs: changes
    if: needs.changes.outputs.install-uv != '[]'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(needs.changes.outputs.install-uv) }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Install libffi and libunwind
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libffi-dev libunwind-dev
      - name: Install
        run: |
          uv venv --python-preference only-managed --python ${{ matrix.python }} "$RUNNER_TEMP/venv"
          uv pip install --python "$RUNNER_TEMP/venv" .
      - name: Check
        run: |
          py="$RUNNER_TEMP/venv/bin/python"
          cd /
          check='
          import warnings, lejit
          with warnings.catch_warnings(record=True) as w:
              warnings.simplefilter("always")
              diffs = lejit.check()
          assert lejit._core is not None, "no extension was built"
          assert not diffs and not w, (sorted(diffs), [str(x.message) for x in w])
          '
          "$py" -c "$check"
          # again with LeJIT started by site, for every program in the venv
          site=$("$py" -c "import site; print(site.getsitepackages()[0])")
          echo 'import lejit; lejit.start()' > "$site/lejit_autostart.pth"
          LEJIT_START_CHECK=warning timeout -s KILL 300 "$py" -c "$check"

  # a Python newer than LeJIT runs on: installing builds no extension, and
  # start() warns and does nothing
  install-main:
    name: install only (CPython main)
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'install')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build CPython main
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libssl-dev zlib1g-dev libffi-dev
          git clone --depth 1 https://github.com/python/cpython "$RUNNER_TEMP/cpython"
          cd "$RUNNER_TEMP/cpython"
          ./configure --prefix="$RUNNER_TEMP/py" --enable-shared LDFLAGS="-Wl,-rpath,$RUNNER_TEMP/py/lib"
          make -j"$(nproc)"
          make install
          ln -s python3 "$RUNNER_TEMP/py/bin/python"
          echo "$RUNNER_TEMP/py/bin" >> "$GITHUB_PATH"
      - name: Install
        run: |
          python -m pip install .
          cd /
          python -c "
          import warnings, lejit
          with warnings.catch_warnings(record=True) as w:
              warnings.simplefilter('always')
              lejit.start()
          assert lejit._core is None, 'an extension was built'
          assert [x.category for x in w] == [RuntimeWarning], w
          "

  # the installed detector agrees with the source one, and the message probes
  # find their messages, on the version the port has reached that make check
  # doesn't run on yet
  detectors-newer:
    name: detectors (${{ matrix.python }})
    needs: changes
    if: needs.changes.outputs.detectors-newer != '[]'
    runs-on: ubuntu-24.04
    container: python:${{ matrix.python }}-bookworm
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(needs.changes.outputs.detectors-newer) }}
    steps:
      - uses: actions/checkout@v4
      - name: Detectors agree with the source
        run: python tests/features/installed_test.py python
      - name: Message probes
        run: make strings-test PY=python GEN_PY=python

  format:
    name: make format-check
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'format')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # the runner's own Python refuses pip installs (PEP 668)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # the version the tree is formatted with: others lay it out differently
      - name: Install clang-format
        run: pip install clang-format==19.1.7
      - name: make format-check
        run: make format-check

  # clang-tidy's findings, reported but not yet fixed: this job never fails
  # the run
  lint:
    name: make lint (3.10.16)
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'lint')
    runs-on: ubuntu-24.04
    container: python:3.10.16-bookworm
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install libffi, libunwind and clang-tidy
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libffi-dev libunwind-dev
          pip install clang-tidy==19.1.0
      - name: make lint
        run: make lint PY=python

  wheels:
    name: wheels (built, not released)
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'wheels')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # cibuildwheel 3 dropped Python 3.7 and 3.8, and 2.x stops before 3.15:
      # 2.x builds 3.7-3.10, 4.x 3.11-3.15
      - uses: pypa/cibuildwheel@v2.23.3
        env:
          CIBW_BUILD: "cp37-* cp38-* cp39-* cp310-*"
          CIBW_SKIP: "*-musllinux_*"
          CIBW_ARCHS_LINUX: x86_64
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_BEFORE_ALL_LINUX: >-
            dnf install -y epel-release &&
            dnf install -y libffi-devel libunwind-devel
          CIBW_TEST_COMMAND: >-
            python -c "import lejit; lejit.start(check=True, error=True); print(sorted(lejit.check()))"
      - uses: pypa/cibuildwheel@v4.3.5
        env:
          CIBW_BUILD: "cp311-* cp312-* cp313-* cp314-* cp315-*"
          CIBW_SKIP: "*-musllinux_*"
          CIBW_ARCHS_LINUX: x86_64
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_BEFORE_ALL_LINUX: >-
            dnf install -y epel-release &&
            dnf install -y libffi-devel libunwind-devel
          CIBW_TEST_COMMAND: >-
            python -c "import lejit; lejit.start(check=True, error=True); print(sorted(lejit.check()))"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: wheelhouse/*.whl

  # the one check branch protection requires: a job skipped by its `if` is
  # reported under its unexpanded matrix name, so the build jobs a docs-only
  # pull request skips can't be required themselves
  passed:
    name: all jobs passed
    needs: [changes, check, encoder, release, build, install-newer,
            install-uv, install-main, detectors-newer, format, lint, wheels]
    if: ${{ always() && !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    steps:
      - env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: test "$FAILED" = false
